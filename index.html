<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#080808"><title>Hakureya</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"></head>
<body><main id="stage" aria-label="Граф Hakureya"><svg id="graph" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Живая карта связей"></svg><div id="info" role="status"></div><button id="replay" title="Повторить визуализацию" aria-label="Повторить визуализацию">↻</button></main>
<button id="avatar" aria-label="Открыть чат Hakureya" aria-controls="chat" aria-expanded="false"><img id="avatar-image" src="/avatar.svg" alt=""><span hidden>❄</span></button>
<aside id="chat" hidden aria-label="Чат Hakureya"><header><strong>Hakureya</strong><button id="close" aria-label="Закрыть чат">×</button></header><div id="messages" role="log" aria-live="polite"></div><section id="book" hidden aria-label="Чтение книги">
<div id="book-toolbar"><button id="book-exit" aria-label="Вернуться в чат">← Чат</button><button id="book-smaller" aria-label="Уменьшить шрифт">A−</button><button id="book-larger" aria-label="Увеличить шрифт">A+</button><button id="book-spacing" aria-label="Изменить межстрочный интервал">↕</button><button id="book-focus" aria-label="Полноэкранное чтение" aria-pressed="false">⛶</button></div>
<article id="book-scroll" tabindex="0"><div id="book-page" aria-live="polite"><div id="book-kicker"></div><h1 id="book-title"></h1><div class="book-ornament" aria-hidden="true">✦</div><div id="book-text"></div><p id="book-end" hidden>Вы на последней опубликованной странице.</p></div></article>
<footer id="book-footer"><button id="book-prev" aria-label="Предыдущая страница">‹</button><div><div id="book-position" aria-live="polite"></div><progress id="book-progress" max="1" value="0" aria-label="Прогресс главы"></progress><progress id="book-volume" max="1" value="0" aria-label="Прогресс опубликованной части тома"></progress></div><button id="book-next" aria-label="Следующая страница">›</button></footer><output id="book-status" role="status"></output>
</section><form id="composer"><textarea id="prompt" required maxlength="12000" rows="2" placeholder="Сообщение…"></textarea><button type="submit">↑</button></form><small id="status">Локальный режим</small></aside>
<menu id="menu" hidden><button id="settings">Подключение Cloud.ru</button><button id="avatar-picker">Загрузить PNG-аватар</button><button id="note-open">Сохранить знание или опыт</button><button id="reset">Повторить рост графа</button></menu>
<dialog id="config"><form method="dialog"><h2>Cloud.ru</h2><p>Ключ хранится только в памяти сервера до перезапуска. Запросы к модели платные.</p><label>Модель<input id="model" maxlength="200"></label><label>API-ключ<input id="key" type="password" autocomplete="off"></label><label><input id="consent" type="checkbox"> Разрешаю отправку сообщений и платные запросы</label><output id="config-status"></output><div><button value="cancel">Закрыть</button><button id="save" type="button">Подключить</button></div></form></dialog>
<input type="file" id="avatar-file" accept="image/png" hidden><dialog id="note-dialog"><form method="dialog"><h2>Добавить память</h2><select id="note-kind"><option value="1">Знание</option><option value="3">Опыт</option></select><textarea id="note-text" rows="5" maxlength="12000" placeholder="Что сохранить?"></textarea><output id="note-status"></output><div><button value="cancel">Закрыть</button><button type="button" id="note-save">Сохранить</button></div></form></dialog><script type="module" src="/web/app.ts"></script></body></html>
